; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny402]
platform = atmelmegaavr
board = ATtiny402
framework = arduino
; 5 MHz: sicher im ganzen Akkubereich (VDD = Akku direkt, bis runter auf 1.8 V)
board_build.f_cpu = 5000000L
; Core-millis() abschalten: TCA0 wird fuer die PWM, TCB0 fuer den eigenen 1-ms-Tick benutzt
build_flags = -DMILLIS_USE_TIMERNONE

; Programmieren ueber SerialUPDI (CP210x USB-UART, TX/RX ueber Diode/Widerstand auf UPDI)
upload_protocol = serialupdi
upload_port = COM7
upload_speed = 230400
